
services:
  db:
    image: postgres:17
    container_name: pcm-gatak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pcm_gatak
      POSTGRES_USER: pcm_user
      POSTGRES_PASSWORD: pcm_docker_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcm_user -d pcm_gatak"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: pcm-gatak-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://pcm_user:pcm_docker_password@db:5432/pcm_gatak
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      HTTPS_ONLY: "False"
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    command: >
      sh -c "uv run --no-sync python manage.py migrate &&
             uv run --no-sync gunicorn config.wsgi:application
             --bind 0.0.0.0:$${PORT:-8000}"

volumes:
  postgres_data:
  media_data:
