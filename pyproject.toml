[project]
name = "pcm-gatak"
version = "0.1.0"
description = "Website PCM Gatak, tugas kuliah Pemrograman Web berbasis Framework"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "django-storages[s3]>=1.14.6",
    "gunicorn>=26.2.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]